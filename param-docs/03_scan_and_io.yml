        definition:
          - file: "be/src/common/config.h"
            context: "CONF_String(datacache_disk_size, \"0\")"
        thrift_propagation: null

    - name: "datacache_block_size"
      type: Long
      default: 262144
      scope: "BE config"
      mutable: false
