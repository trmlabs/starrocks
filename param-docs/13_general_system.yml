# =============================================================================
# BE configuration parameters (be/src/common/config.h)
# =============================================================================

be_config:

  # ---------------------------------------------------------------------------
  # BE server identity and ports
  # ---------------------------------------------------------------------------

  - name: "cluster_id"
    type: Int32
    default: -1
    scope: "BE config"
    mutable: false
    description: >
      Cluster identifier. -1 means auto-assigned by the FE during first
      heartbeat. Should not be changed manually.
    code_references:
      definition:
