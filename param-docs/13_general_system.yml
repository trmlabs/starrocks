  # ---------------------------------------------------------------------------

  - name: "div_precision_increment"
    type: integer
    default: 4
    scope: "session"
    mutable: true
    description: >
      Number of digits by which to increase the scale of the result of
      division operations. MySQL-compatible.
    code_references:
      definition:
        - file: "fe/fe-core/src/main/java/com/starrocks/qe/SessionVariable.java"
          line: 269
